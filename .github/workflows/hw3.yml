name: CS122 HW3 statistics and plan costing
on:
  push:
    branches: [edidada/hw3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven framework, parser, HW1 through HW3
        run: mvn -B -Dnanodb.test.groups=framework,parser,hw1,hw2,hw3 verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Gradle framework, parser, HW1 through HW3
        run: gradle --no-daemon -PtestGroups=framework,parser,hw1,hw2,hw3 test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw3-costing-results
          path: |
            target/surefire-reports/
            build/test-results/
