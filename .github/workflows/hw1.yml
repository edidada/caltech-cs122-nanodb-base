name: CS122 HW1 storage correctness
on:
  push:
    branches: [edidada/hw1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven original framework and parser tests
        run: mvn --batch-mode -Dnanodb.test.groups=framework,parser,hw1 verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Gradle original framework and parser tests
        run: gradle --no-daemon -PtestGroups=framework,parser,hw1 test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw1-storage-results
          path: |
            target/surefire-reports/
            build/test-results/
