name: CS122 HW1 storage correctness
on:
  push:
    branches: [edidada/hw1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven framework, parser, original HW1 and added storage tests
        run: mvn --batch-mode -Dnanodb.test.groups=framework,parser,hw1 verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Gradle framework, parser, original HW1 and added storage tests
        run: gradle --no-daemon -PtestGroups=framework,parser,hw1 test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw1-storage-results
          path: |
            target/surefire-reports/
            build/test-results/
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d93810fc433c948a2f4ff701e28a96319096745a
          path: first-fit-baseline
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full official 20k, 50k and 50k-delete SQL benchmarks
        run: python scripts/hw1_performance.py --baseline first-fit-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw1-full-performance
          path: target/hw1-performance/
