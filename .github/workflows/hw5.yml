name: CS122 HW5 advanced subqueries
on:
  push:
    branches: [edidada/hw5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven framework, parser, HW1 through HW5
        run: mvn -B -Dnanodb.test.groups=framework,parser,hw1,hw2,hw3,hw4,hw5 verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Gradle framework, parser, HW1 through HW5
        run: gradle --no-daemon -PtestGroups=framework,parser,hw1,hw2,hw3,hw4,hw5 test
      - name: Official stores-28K optimizer and query-order experiments
        run: python scripts/hw4_experiments.py --updated-expression-costs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-regression-results
          path: |
            target/surefire-reports/
            build/test-results/
            target/hw4-experiments/
