name: CS122 Challenge2 query features
on:
  push:
    branches: [edidada/challenge2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tpch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original query template provenance
        run: python scripts/verify_tpch_queries.py
      - name: Maven all labs and index transaction integration
        run: mvn -B -Dnanodb.test.groups=framework,parser,hw1,hw2,hw3,hw4,hw5,hw6,hw7,challenge1,challenge2 verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Gradle all labs and index transaction integration
        run: gradle --no-daemon -PtestGroups=framework,parser,hw1,hw2,hw3,hw4,hw5,hw6,hw7,challenge1,challenge2 test
      - name: Official full stores regression
        run: python scripts/hw4_experiments.py --updated-expression-costs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge2-progress
          path: |
            target/surefire-reports/
            build/test-results/
            target/hw4-experiments/
            target/challenge1/results.json
            target/challenge1/execution.log
            target/challenge1/inputs/oracle.json
